
name: Build NAZIR Wi-Fi Motion Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android TV APK
        working-directory: NAZIR-WiFi-Motion-System/AndroidTV
        run: gradle assembleDebug

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows Receiver
        run: |
          dotnet publish NAZIR-WiFi-Motion-System/WindowsReceiver/WindowsReceiver.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o out/windows

      - name: Package Build Files
        run: |
          mkdir -p out
          cp NAZIR-WiFi-Motion-System/AndroidTV/app/build/outputs/apk/debug/app-debug.apk out/NAZIR-WiFi-TV.apk
          cd out
          zip -r WindowsReceiver-win-x64.zip windows

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nazir-wifi-motion-builds
          path: out/*
